!
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$i28SGzk2UlXJ3ZEE$4JZat.NUg13LZ80dnxFChuYr/1nVnszDVX9QVsH.xcXslJECI9rTn/ZsKTIiawiCauTOk.X6CX7hdcZ10T1tY/
username arista privilege 15 role network-admin secret sha512 $6$32zzMgw/sBaSR2H7$3V8dxgXMC927kq2RuC3ORDE1RKoIfGEJkCF/fYFHMlObrl0DZSvIXwTwILYtV0Ssj8Qx2iz1xLbEX3dkvDHsP1
!
management api http-commands
   shutdown
!
alias "web on"
   10 configure
   20 management api http-commands
   30 no shutdown
   40 end
