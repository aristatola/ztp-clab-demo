dhcp server
   dns server ipv4 9.9.9.9 8.8.8.8
   !
   subnet 192.168.130.0/24
      range 192.168.130.240 192.168.130.254
      lease time 0 days 12 hours 0 minutes
      default-gateway 192.168.130.1
