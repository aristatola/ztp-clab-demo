   vrf MGMT
   ip address 192.168.128.104/24
!
interface Vlan1
   description ZTP_INBAND
   no autostate
   ip address 192.168.130.1/24
   dhcp server ipv4
!
ip routing
ip routing vrf MGMT
!
ip route 0.0.0.0/0 10.0.100.1
ip route vrf MGMT 0.0.0.0/0 192.168.128.1
!
