hostname server01
!
username arista privilege 15 role network-admin secret sha512 $6$32zzMgw/sBaSR2H7$3V8dxgXMC927kq2RuC3ORDE1RKoIfGEJkCF/fYFHMlObrl0DZSvIXwTwILYtV0Ssj8Qx2iz1xLbEX3dkvDHsP1
username arista privilege 15 role network-admin secret sha512 $6$32zzMgw/sBaSR2H7$3V8dxgXMC927kq2RuC3ORDE1RKoIfGEJkCF/fYFHMlObrl0DZSvIXwTwILYtV0Ssj8Qx2iz1xLbEX3dkvDHsP1
!
vrf instance MGMT
!
ip name-server vrf MGMT 8.8.8.8 priority 1
!
ip routing
ip routing vrf MGMT
!
ip route vrf MGMT 0.0.0.0/0 192.168.128.1
!
vlan 1
   name ZTP_INBAND
!
dhcp server
   !
   dns server ipv4 9.9.9.9 8.8.8.8
   !
   subnet 10.1.10.0/24
      range 10.1.10.240 10.1.10.254
      name POD06
      lease time 0 days 12 hours 0 minutes
      default-gateway 10.1.10.1
      tftp server file https://10.1.10.1/eapi/bootstrap.py
   !
!
interface Vlan1
   description ZTP_INBAND
   no autostate
   ip address 10.1.10.1/24
   dhcp server ipv4
!
interface Ethernet1
   description UPLINK
   switchport
   switchport mode access
!
interface Management0
   vrf MGMT
   ip address 172.100.100.103/24
!
daemon Bootstrap
   exec /usr/bin/python3 -m http.server 3333 --directory /mnt/flash/ztp
!
event-handler HTTP_SERVER
   trigger on-boot
   action bash
      sudo ln -s /mnt/flash/ztp/bootstrap.py  /usr/share/nginx/html/eapi/bootstrap.py
!
management api http-commands
   no shutdown
!