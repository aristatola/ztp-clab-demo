!
hostname ztp-switch3
!
interface Management0
   vrf MGMT
   ip address 172.100.100.103/24
!
vrf instance MGMT
!
ip routing
ip routing vrf MGMT
!
dhcp server vrf MGMT
   subnet 172.100.100.0/24
      range 172.100.100.201 172.100.100.210
      default-gateway 172.100.100.1
      dns-server 172.100.100.1
      bootfile bootstrap.py
      tftp-server 172.100.100.103
!
event-handler HTTP_SERVER
   trigger on-boot
   action bash
      python3 -m http.server 80 --directory /mnt/flash/bootstrap/ &
