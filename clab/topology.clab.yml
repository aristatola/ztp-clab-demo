# =============================================================================
# Containerlab Topology: Arista ZTP Demo
# =============================================================================
#
# This topology creates a small lab for testing Arista's Zero Touch Provisioning
# (ZTP). ZTP allows network switches to automatically download and apply their
# configuration when they boot up for the first time — no manual setup needed.
#
# How it works:
#   1. ztp-switch1 and ztp-switch2 boot with NO configuration (ZTP mode)
#   2. They send a DHCP request over the management network
#   3. ztp-switch3 runs a DHCP server that responds with:
#      - An IP address for the switch
#      - The URL of a Python bootstrap script
#   4. The switch downloads and runs the bootstrap script from ztp-switch3's
#      HTTP server, which configures the switch automatically
#
# To deploy:  containerlab deploy -t clab/topology.clab.yml
# To destroy: containerlab destroy -t clab/topology.clab.yml
# =============================================================================
---
name: ztp-demo

# No prefix means container names match node names exactly (e.g., "ztp-switch1")
prefix: ""

# Management network — all nodes connect to this network automatically.
# This is where ZTP DHCP/HTTP traffic flows between the switches and ztp-switch3.
mgmt:
  network: mgmt
  ipv4-subnet: 192.168.128.0/24

topology:

  # ---------------------------------------------------------------------------
  # Node defaults by kind
  # ---------------------------------------------------------------------------
  kinds:
    arista_ceos:
      # When false, the switch won't enforce a startup config on boot.
      # This is required for ZTP — the switch must boot "clean" with no config.
      enforce-startup-config: false
      image: ceos:4.35.6M
      env:
        # Place the management interface in VRF "MGMT" (standard Arista practice)
        CLAB_MGMT_VRF: MGMT
        # Use "et" (Ethernet) interface naming instead of the default
        INTFTYPE: et

  # ---------------------------------------------------------------------------
  # Nodes
  # ---------------------------------------------------------------------------
  nodes:

    # ---- ZTP Switch 1 (boots into ZTP mode) ----
    ztp-switch1:
      kind: arista_ceos
      mgmt-ipv4: 192.168.128.101
      # Empty startup config + zerotouch-config = switch enters ZTP on boot
      startup-config: configs/empty.cfg
      binds:
        # Serial number file — gives the cEOS container a unique identity
        - sn/ztp-switch1.txt:/mnt/flash/ceos-config:ro
        # ZTP control file — when this does NOT contain "DISABLE=True",
        # the switch will enter ZTP mode on boot
        - zerotouch-config:/mnt/flash/zerotouch-config:rw
      ports:
        - 4001:443/tcp

    # ---- ZTP Switch 2 (boots into ZTP mode) ----
    ztp-switch2:
      kind: arista_ceos
      mgmt-ipv4: 192.168.128.102
      startup-config: configs/empty.cfg
      binds:
        - sn/ztp-switch2.txt:/mnt/flash/ceos-config:ro
        - zerotouch-config:/mnt/flash/zerotouch-config:rw
      ports:
        - 4002:443/tcp

    # ---- ZTP Switch 3 (boots into ZTP mode) ----
    ztp-switch3:
      kind: arista_ceos
      mgmt-ipv4: 192.168.128.103
      startup-config: configs/empty.cfg
      binds:
        - sn/ztp-switch3.txt:/mnt/flash/ceos-config:ro
        - zerotouch-config:/mnt/flash/zerotouch-config:rw
      ports:
        - 4003:443/tcp

    mgmt-sw01:
      kind: arista_ceos
      mgmt-ipv4: 192.168.128.104
      # Full startup config — DHCP server + HTTP server for bootstrap delivery
      startup-config: configs/mgmt-sw01.cfg
      binds:
        - sn/mgmt-sw01.txt:/mnt/flash/ceos-config:ro
        # Bootstrap script directory — served over HTTP to ZTP switches
        - bootstrap/:/usr/share/nginx/html/ztp/:ro
        - boot_configs/:/usr/share/nginx/html/configs/:ro
        - eos_images/:/usr/share/nginx/html/images/:ro
      ports:
        - 4004:443/tcp
    
  # ---------------------------------------------------------------------------
  # Links
  # ---------------------------------------------------------------------------
  # A single data-plane link connecting the two ZTP switches.
  # This link is for testing connectivity after ZTP completes.
  # (ZTP itself happens over the management network, not this link.)
  links:

    # Mgmt Internet
    - endpoints: ["mgmt-sw01:et10", "macvlan:enp86s0"]

    # Mgmt to Network
    - endpoints: ["mgmt-sw01:et1", "ztp-switch1:et10"]
    - endpoints: ["mgmt-sw01:et2", "ztp-switch2:et10"]
    - endpoints: ["mgmt-sw01:et3", "ztp-switch3:et10"]

    # Switch Connections
    - endpoints: ["ztp-switch1:et1", "ztp-switch3:et1"]
    - endpoints: ["ztp-switch2:et1", "ztp-switch3:et2"]
    - endpoints: ["ztp-switch1:et3", "ztp-switch2:et3"]
